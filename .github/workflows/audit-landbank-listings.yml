name: Audit West End Landbank Listings
on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * 1'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact listings
        run: python scripts/audit_landbank_listings.py
      - name: Commit audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/landbank-verification.json
          git diff --cached --quiet || (git commit -m "Refresh verified Landbank listing audit" && git push)
