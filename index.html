<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Louisville Property & Land Use Explorer</title></head><body><p id="status">Loading Citywide VAP map…</p><script>
(async()=>{
try{
const response=await fetch('./citywide-base.html');if(!response.ok)throw Error('Base map unavailable');
let html=await response.text();
html=html.replace('<div class="layer"><input id="lyr-annual"', '<div class="layer"><input id="lyr-closed" type="checkbox"><span class="swatch circle" style="background:#8256bd;border:1px solid #41296c"></span><label for="lyr-closed">Historical Closed Work Orders</label><span class="count" id="closedCount">Loading…</span></div><div class="layer"><input id="lyr-annual"');
html=html.replace('</body>', '<script src="./data/citywide-history.js"><\/script></body>');
document.open();document.write(html);document.close();
}catch(e){document.getElementById('status').textContent='Unable to load Citywide VAP: '+e.message}
})();
</script></body></html>
