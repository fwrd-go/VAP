<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAP CITY | Landbank Listings</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#102d3b;color:#f2f7f9;font:14px system-ui}header{padding:14px 18px;background:#153c4e}h1{margin:0 0 6px;font-size:22px}a{color:#77e1d6}#summary{padding:10px 18px;background:#21495a}main{display:grid;grid-template-columns:minmax(260px,330px) 1fr;height:calc(100dvh - 130px)}#list{overflow:auto;padding:10px}.item{padding:12px;border-bottom:1px solid #476370;cursor:pointer}.item:hover{background:#235266}#map{min-height:350px}.sub{font-size:12px;color:#c2d6dc;margin-top:5px}@media(max-width:650px){main{grid-template-columns:1fr;grid-template-rows:38% 62%}#list{order:2}#map{order:1}}</style></head><body><header><h1>VAP CITY · Landbank Listings</h1><a href="./west-end.html">West End map</a> · <a href="./index.html">Citywide VAP</a></header><div id="summary">Loading reported listings…</div><main><aside id="list"></aside><div id="map"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([38.24,-85.78],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const layer=L.layerGroup().addTo(map);
(async()=>{try{const response=await fetch('./data/landbank-listings.json?cache='+Date.now());if(!response.ok)throw Error('Listing file unavailable');const feed=await response.json();const items=feed.records;document.getElementById('summary').textContent=items.length+' named listings imported · '+feed.source_reported_total+' reported by third-party source (not independently verified) · '+feed.source_reported_updated;const markers=[];for(const r of items){const item=document.createElement('div');item.className='item';const name=document.createElement('strong');name.textContent=r.address;item.append(name);const sub=document.createElement('div');sub.className='sub';sub.textContent='Third-party reported · Official availability unverified';item.append(sub);const link=document.createElement('a');link.href=r.source_url;link.target='_blank';link.rel='noopener';link.textContent='Source market';item.append(link);document.getElementById('list').append(item);try{const u='https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?'+new URLSearchParams({SingleLine:r.address+', Louisville, KY',f:'json',outFields:'Match_addr',maxLocations:'1'});const q=await fetch(u);const j=await q.json();const p=j.candidates?.[0];if(p&&p.score>=85){const m=L.circleMarker([p.location.y,p.location.x],{radius:7,color:'#1a4857',fillColor:'#38b4bf',fillOpacity:.95}).addTo(layer);const box=document.createElement('div');const title=document.createElement('strong');title.textContent=r.address;box.append(title);const detail=document.createElement('p');detail.textContent='Reported on third-party Landbank market. Availability not independently confirmed.';box.append(detail);const a=document.createElement('a');a.href=r.source_url;a.target='_blank';a.rel='noopener';a.textContent='View source';box.append(a);m.bindPopup(box);item.addEventListener('click',()=>{map.setView(m.getLatLng(),16);m.openPopup()});markers.push(m)}}catch(e){console.warn('Geocoding unavailable for',r.address,e)}}if(markers.length){const bounds=L.featureGroup(markers).getBounds();if(bounds.isValid())map.fitBounds(bounds.pad(.1))}document.getElementById('summary').textContent+=' · '+markers.length+' mapped';}catch(e){document.getElementById('summary').textContent='Could not load listings: '+e.message}})();
</script></body></html>
